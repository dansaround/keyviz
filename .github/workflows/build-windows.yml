name: Build (Windows)

# Windows-only build of this fork (ASUS ROG flavored CTRL/ALT legends).
# Same approach as dansaround/whisperaround: native windows-latest runner,
# pinned actions, read-only token, installer uploaded as a workflow artifact.
# Pushing a v* tag also publishes the MSI as a GitHub Release (release job only).
on:
  push:
    branches:
      - windows-modifiers
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install frontend deps
        run: npm ci

      - name: Build installer (MSI)
        shell: bash
        run: npx tauri build --bundles msi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keyviz-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          retention-days: 90

  # Only for v* tags: publish the MSI from the build job as a GitHub Release.
  # The only job with write access; it runs no repo code, just the gh CLI.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: keyviz-windows-msi
          path: msi

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -q '\.msi$'; then
              echo "Release $TAG already has an MSI; leaving it unchanged."
            else
              gh release upload "$TAG" msi/*.msi -R "$REPO"
            fi
          else
            gh release create "$TAG" msi/*.msi -R "$REPO" \
              --title "Keyviz $TAG - Windows only, ASUS ROG flavored" \
              --notes "Windows-only build of this fork: CTRL/ALT legends traced from my ASUS ROG laptop keycaps + Windows logo key. Download the .msi below and run it."
          fi
